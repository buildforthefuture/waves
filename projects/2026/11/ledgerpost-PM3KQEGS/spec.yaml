title: Ledgerpost
slug: ledgerpost
domain: fintech-infra
tags:
  - ledger
  - double-entry
  - idempotency
  - payments
  - library
summary: >-
  An embeddable double-entry posting engine that turns at-least-once
  requests into exactly-once balanced ledger movements.
problem: >-
  Payment-adjacent services receive the same business event repeatedly:
  delivery webhooks retry, clients resend after timeouts, jobs re-run
  after crashes. Each repeat must produce one set of ledger movements,
  and those movements must balance per currency. Teams glue a hand-rolled
  dedupe store beside ledger code and the two drift apart, producing
  double credits or silent gaps.
users:
  - Backend engineers building wallets, billing, and payment-adjacent services
  - Platform teams embedding a small ledger inside a larger service
  - Maintainers of accounting integrations that receive retried webhooks
goals:
  - Claim a request key once and apply its transaction at most once
  - Return the recorded outcome on every repeated request
  - Enforce per-currency debit and credit balance at construction time
  - Answer account balances and a per-currency trial balance
  - Offer a pluggable idempotency store protocol with a thread-safe in-memory reference
  - Run on any Python 3.10+ interpreter with no third-party runtime packages
non_goals:
  - Shipping database-backed store implementations
  - HTTP endpoints, webhook receivers, or queue consumers
  - Currency conversion or exchange-rate handling
  - Report, export, or statement formats
  - Distributed transaction coordination across services
requirements:
  - id: FR-001
    title: Integer minor-unit money
    priority: MUST
    description: >
      Provide an immutable Money value carrying an integer count of minor
      units and a three-letter uppercase currency code. Reject floats and
      booleans at construction, support exact addition, subtraction,
      integer scaling, ordering, and lossless allocation by integer ratios.
    acceptance:
      - Constructing Money with a float or bool raises InvalidAmountError
      - 10 plus 20 minor units equals exactly 30 minor units
      - Adding amounts of two currencies raises CurrencyMismatchError
      - Allocating 5 minor units across three equal ratios yields 2, 2, 1 and sums back to 5
  - id: FR-002
    title: Balanced transactions by construction
    priority: MUST
    description: >
      A Transaction holds at least two postings, each an account name, a
      debit or credit direction, and a positive Money amount. Construction
      fails unless debit and credit totals match for every currency in the
      transaction, so a multi-currency transaction is allowed when each
      currency balances on its own.
    acceptance:
      - Debit 25.00 against credit 24.00 raises UnbalancedTransactionError
      - A transaction with fewer than two postings raises InsufficientPostingsError
      - A transaction balancing USD and EUR independently is accepted
      - A currency with credits and no debits raises UnbalancedTransactionError
  - id: FR-003
    title: Idempotent posting
    priority: MUST
    description: >
      The engine posts a transaction under a caller-chosen request key.
      The first call claims the key, applies the transaction to the ledger,
      and returns a fresh outcome. Every later call with the same key
      applies nothing and returns the recorded transaction flagged as a
      replay. Concurrent callers racing on one key observe exactly one
      fresh outcome.
    acceptance:
      - Posting the same key five times appends exactly one transaction
      - The replay outcome carries the first transaction, not the new one
      - Distinct keys posting equal transactions append two transactions
      - Sixteen threads racing one key produce one fresh outcome and fifteen replays
  - id: FR-004
    title: Balances and trial balance
    priority: MUST
    description: >
      The ledger keeps posted transactions in apply order and running
      per-account, per-currency balances where debits increase and credits
      decrease the figure. It answers a single-currency balance, a full
      per-currency balance map, and a trial balance that sums every
      account per currency.
    acceptance:
      - After a 2500-unit sale the asset account shows 2500 and the income account -2500
      - The trial balance of a ledger fed balanced transactions is zero for every currency
      - An unknown account balances to zero rather than raising
  - id: FR-005
    title: Recorded outcome on replay
    priority: MUST
    description: >
      Outcomes are immutable value objects pairing the transaction with a
      replay flag. The store records the first accepted outcome; replays
      return the identical transaction object with the flag set, so
      callers see one stable answer per business event.
    acceptance:
      - Replay returns a transaction equal to the first outcome's transaction
      - Mutating an outcome attribute raises FrozenInstanceError
      - The replay flag is false exactly once per key
  - id: FR-006
    title: Pluggable idempotency store
    priority: SHOULD
    description: >
      Define a two-method store protocol, get and put_if_absent, whose
      implementations must make claims atomic. Ship a thread-safe
      in-memory reference implementation and document that durable
      backends share the ledger's transaction boundary.
    acceptance:
      - The reference store passes the same race tests as the engine
      - An alternate store implementation passes the engine test suite unchanged
      - The protocol documentation states the atomicity contract
  - id: FR-007
    title: Typed error model
    priority: SHOULD
    description: >
      Raise a family of exceptions under one base class covering money,
      transaction, and store mistakes, each with a message naming the
      offending value so callers can branch on specific cases.
    acceptance:
      - Every public error derives from LedgerpostError
      - Error messages contain the offending value, not a bare code
  - id: FR-008
    title: Account and key hygiene
    priority: SHOULD
    description: >
      Account names, transaction ids, request keys, and metadata entries
      are bounded in length and reject empty strings and control
      characters, keeping hostile delivery payloads from polluting the
      ledger.
    acceptance:
      - Accounts or keys with control characters raise before any mutation
      - Oversized names raise with the limit named in the message
  - id: FR-009
    title: Transaction metadata
    priority: COULD
    description: >
      Transactions may carry a small string-to-string metadata mapping,
      stored read-only, for correlation ids and delivery markers.
    acceptance:
      - Metadata survives as an immutable mapping copy
      - Non-string keys or values raise InvalidPostingError
  - id: NFR-001
    title: Deterministic outcomes
    priority: MUST
    description: >
      Core logic reads no wall clock and generates no identifiers;
      transactions carry caller-assigned ids, so identical inputs produce
      identical outcomes on every run.
    acceptance:
      - Two runs of the same posting sequence produce equal outcomes
      - No module in the package imports time or uuid
  - id: NFR-002
    title: Zero runtime dependencies
    priority: MUST
    description: >
      The package imports only the standard library on Python 3.10 or
      newer, keeping the dependency surface of payment paths minimal.
    acceptance:
      - Runtime imports are standard library only
      - The declared dependency list in pyproject is empty
  - id: NFR-003
    title: Safe under concurrent posting
    priority: SHOULD
    description: >
      One engine instance over one ledger and store handles concurrent
      threads without lost postings or duplicate applications.
    acceptance:
      - Sixteen threads with distinct keys append sixteen transactions
      - The trial balance stays zero after the concurrent runs
  - id: NFR-004
    title: Predictable performance
    priority: SHOULD
    description: >
      Posting and balance queries run in time linear in the postings they
      touch, and ten thousand sequential postings complete within a few
      seconds on commodity hardware.
    acceptance:
      - A ten-thousand-posting sequential run finishes inside five seconds
stack:
  language: Python
  runtime: CPython 3.10 or newer
  libraries: []
  build: setuptools through pyproject.toml
  test: unittest discovery
  lint: ruff
  typecheck: mypy in strict mode
test_strategy: >-
  Unittest suites per module map every MUST and SHOULD requirement to at
  least one named test: construction rejections for money and
  transactions, engine idempotency including a sixteen-thread same-key
  race and a sixteen-thread distinct-key race, ledger balance and trial
  balance arithmetic, and an integration suite that replays webhook
  deliveries out of order with duplicates. A seeded random loop posts two
  hundred balanced transactions across three currencies and asserts a
  zero trial balance. Lint and strict type checking run alongside tests
  in continuous integration.
security_notes: >-
  The package performs no network or filesystem input and output and
  holds no secrets. Hostile delivery payloads are contained by
  construction checks: amounts are integers, names and keys are bounded
  and reject control characters, and metadata is copied into an
  immutable mapping. The engine never logs; visibility decisions stay
  with the caller. Durability and the exactly-once guarantee across
  process restarts depend on the store backend sharing a transaction
  boundary with the ledger, which is documented rather than assumed.
roadmap:
  - Reference store and ledger backed by one embedded database in a single transaction boundary
  - Snapshot and restore of ledger state for restart-safe deployments
  - Optional outbox-style hooks that notify callers after a successful claim
  - Statement and export adapters built on the query surface
  - Currency metadata table covering ISO 4217 exponents for display formatting

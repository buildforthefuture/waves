name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check src tests examples
      - name: Type check
        run: mypy
      - name: Test
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
      - name: Example
        run: python examples/webhook_replay.py
        env:
          PYTHONPATH: src
